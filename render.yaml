services:
  # 1. Python ML Service (FastAPI)
  - type: web
    name: resume-ml-service
    env: python
    rootDir: ml_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free

  # 2. Node.js Backend Service (Express)
  - type: web
    name: resume-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: MONGO_URI
        sync: false # User will provide their MongoDB Atlas URI during setup
      - key: JWT_SECRET
        generateValue: true # Render will automatically generate a secure JWT secret
      - key: ML_SERVICE_URL
        fromService:
          name: resume-ml-service
          type: web
